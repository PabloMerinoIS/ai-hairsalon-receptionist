<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pedir cita</title>
<style>
  :root {
    --accent: #b4573b;
    --accent-soft: color-mix(in srgb, var(--accent) 12%, white);
    --bot: color-mix(in srgb, var(--accent) 8%, #f4f1ec);
    --ink: #24201d; --muted: #6f6862; --line: #e6e0d9; --bg: #f7f5f2;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); display: flex; justify-content: center; }
  .app { width: 100%; max-width: 560px; height: 100dvh; display: flex; flex-direction: column; background: #fff; }
  @media (min-width: 620px) { body { padding: 24px 0; } .app { height: calc(100dvh - 48px); border-radius: 22px; box-shadow: 0 24px 60px -28px rgba(0,0,0,.35); border: 1px solid var(--line); overflow: hidden; } }

  header { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--accent); color: #fff; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.22); display: grid; place-items: center; font-weight: 700; font-size: 18px; flex: none; }
  header b { display: block; font-size: 16px; line-height: 1.2; }
  header small { font-size: 12px; opacity: .88; display: flex; align-items: center; gap: 6px; }
  header small i { width: 7px; height: 7px; border-radius: 50%; background: #8df0b0; display: inline-block; }

  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 86%; padding: 10px 14px; border-radius: 16px; font-size: 15.5px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; animation: pop .18s ease-out; }
  .msg.bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.user { background: var(--accent); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .dots { display: inline-flex; gap: 4px; padding: 4px 0; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: #a89b92; animation: blink 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 12px; }
  .chip { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 8px 14px; font-size: 14px; cursor: pointer; font-family: inherit; color: var(--ink); }
  .chip:hover { border-color: var(--accent); background: var(--accent-soft); }

  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); background: #fff; }
  #texto { flex: 1; padding: 13px 16px; border: 1.5px solid var(--line); border-radius: 999px; font-size: 16px; font-family: inherit; outline: none; min-width: 0; }
  #texto:focus { border-color: var(--accent); }
  #enviar { background: var(--accent); color: #fff; border: 0; border-radius: 999px; width: 48px; height: 48px; cursor: pointer; font-size: 18px; flex: none; }
  #enviar:disabled { opacity: .45; cursor: default; }
  .aviso { text-align: center; font-size: 11.5px; color: var(--muted); padding: 0 12px 10px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar" id="inicial">·</div>
    <div><b id="titulo">Pedir cita</b><small><i></i> Asistente virtual · IA</small></div>
  </header>
  <div id="chat"></div>
  <div class="chips" id="chips">
    <button class="chip" type="button">Quiero pedir cita</button>
    <button class="chip" type="button">¿Qué servicios hacéis?</button>
    <button class="chip" type="button">¿Qué horario tenéis?</button>
  </div>
  <form id="form">
    <input id="texto" placeholder="Escribe aquí…" autocomplete="off" maxlength="500">
    <button id="enviar" aria-label="Enviar">➤</button>
  </form>
  <div class="aviso">Estás hablando con un asistente de inteligencia artificial.</div>
</div>

<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const texto = document.getElementById('texto');
  const enviar = document.getElementById('enviar');
  const chips = document.getElementById('chips');
  const negocioSlug = new URLSearchParams(location.search).get('n') || '';
  let sesion = null, ocupado = false, nombreNegocio = '';

  function pinta(clase, contenido) {
    const d = document.createElement('div');
    d.className = 'msg ' + clase;
    d.textContent = contenido;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }

  function pintaEscribiendo() {
    const d = document.createElement('div');
    d.className = 'msg bot';
    const puntos = document.createElement('span');
    puntos.className = 'dots';
    puntos.append(document.createElement('i'), document.createElement('i'), document.createElement('i'));
    d.appendChild(puntos);
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }

  function saludo() {
    pinta('bot', '¡Hola! 👋 Soy el asistente virtual' + (nombreNegocio ? ' de ' + nombreNegocio : '') + '. ¿En qué te puedo ayudar?');
  }

  async function manda(mensaje) {
    if (ocupado) return;
    ocupado = true;
    enviar.disabled = true;
    chips.style.display = 'none';
    pinta('user', mensaje);
    const espera = pintaEscribiendo();
    try {
      const r = await fetch('/api/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({mensaje, sesion, negocio: negocioSlug})
      });
      const datos = await r.json().catch(() => ({}));
      espera.remove();
      if (r.status === 429) {
        pinta('bot', 'Has llegado al límite de mensajes. Vuelve a intentarlo más tarde.');
      } else if (datos.error) {
        pinta('bot', 'Vaya, algo ha fallado. Inténtalo de nuevo en un momento.');
      } else {
        sesion = datos.sesion;
        pinta('bot', datos.respuesta);
      }
    } catch (e) {
      espera.remove();
      pinta('bot', 'No he podido conectar. Inténtalo de nuevo en un momento.');
    }
    ocupado = false;
    enviar.disabled = false;
    texto.focus({preventScroll: true});
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const m = texto.value.trim();
    if (!m) return;
    texto.value = '';
    manda(m);
  });
  chips.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => manda(c.textContent)));

  // Cargamos el nombre y el color de la peluquería antes de saludar
  fetch('/api/negocio' + (negocioSlug ? '?n=' + encodeURIComponent(negocioSlug) : ''))
    .then(r => r.json())
    .then(n => {
      if (n.nombre) {
        nombreNegocio = n.nombre;
        document.getElementById('titulo').textContent = n.nombre;
        document.getElementById('inicial').textContent = n.nombre.trim().charAt(0).toUpperCase();
        document.title = 'Pedir cita · ' + n.nombre;
      }
      if (/^#[0-9a-fA-F]{6}$/.test(n.color || '')) document.documentElement.style.setProperty('--accent', n.color);
    })
    .catch(() => {})
    .finally(() => { saludo(); texto.focus({preventScroll: true}); });
</script>
</body>
</html>
