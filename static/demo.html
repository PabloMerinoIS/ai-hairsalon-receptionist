<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Modo demostración · Chat y agenda</title>
<style>
  :root {
    --bg: #faf6f1; --surface: #ffffff; --ink: #2b2320; --muted: #6f625b; --line: #eadfd3;
    --accent: #b4573b; --accent-dark: #8f432c; --accent-soft: #f6e4dc; --bot: #f1e9df;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; }

  .barra { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--bg); }
  .barra h1 { margin: 0; font-size: 16px; }
  .barra h1 small { font-weight: 400; color: var(--muted); margin-left: 8px; }
  .barra button { font-family: inherit; cursor: pointer; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 14px; font-size: 13.5px; color: var(--ink); }
  .barra button:hover { border-color: var(--accent); background: var(--accent-soft); }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(340px, 420px) 1fr; gap: 20px; padding: 20px; }

  .chat-col, .agenda-col { min-height: 0; display: flex; flex-direction: column; }
  .rotulo { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 8px 4px; }

  .phone { flex: 1; min-height: 0; background: var(--surface); border-radius: 22px; box-shadow: 0 24px 60px -28px rgba(90, 50, 30, .4); border: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; }
  .phone-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--accent); color: #fff; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.22); display: grid; place-items: center; font-weight: 700; font-size: 17px; }
  .phone-head b { display: block; font-size: 15px; line-height: 1.2; }
  .phone-head small { font-size: 12px; opacity: .85; display: flex; align-items: center; gap: 6px; }
  .phone-head small i { width: 7px; height: 7px; border-radius: 50%; background: #8df0b0; display: inline-block; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #fffdfb; }
  .msg { max-width: 84%; padding: 10px 14px; border-radius: 16px; font-size: 15px; white-space: pre-wrap; word-wrap: break-word; animation: pop .18s ease-out; }
  .msg.bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.user { background: var(--accent); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .dots { display: inline-flex; gap: 4px; padding: 4px 0; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: #a89b92; animation: blink 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; }
  .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 12px; background: #fffdfb; }
  .chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 13.5px; cursor: pointer; font-family: inherit; color: var(--ink); }
  .chip:hover { border-color: var(--accent); background: var(--accent-soft); }
  #form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); background: var(--surface); }
  #texto { flex: 1; padding: 12px 16px; border: 1.5px solid var(--line); border-radius: 999px; font-size: 15px; font-family: inherit; outline: none; min-width: 0; }
  #texto:focus { border-color: var(--accent); }
  #enviar { background: var(--accent); color: #fff; border: 0; border-radius: 999px; width: 46px; height: 46px; cursor: pointer; font-size: 18px; flex: none; }
  #enviar:disabled { opacity: .45; cursor: default; }

  .agenda-col iframe { flex: 1; min-height: 0; width: 100%; border: 1px solid var(--line); border-radius: 18px; background: var(--bg); box-shadow: 0 24px 60px -28px rgba(90, 50, 30, .3); }

  @media (max-width: 900px) {
    body { height: auto; }
    main { grid-template-columns: 1fr; padding: 14px; }
    .phone { height: 520px; flex: none; }
    .agenda-col iframe { height: 620px; flex: none; }
  }
</style>
</head>
<body>

<div class="barra">
  <h1>Modo demostración <small id="negocio"></small></h1>
  <button id="reiniciar" type="button">Nueva conversación</button>
</div>

<main>
  <section class="chat-col">
    <p class="rotulo">Lo que ve el cliente</p>
    <div class="phone">
      <div class="phone-head">
        <div class="avatar" id="inicial">·</div>
        <div><b id="titulo">Asistente</b><small><i></i> Asistente virtual · IA</small></div>
      </div>
      <div id="chat"></div>
      <div class="chips" id="chips">
        <button class="chip" type="button">Quiero una cita para mañana</button>
        <button class="chip" type="button">¿Cuánto cuesta un tinte?</button>
        <button class="chip" type="button">¿Se puede pagar con tarjeta?</button>
      </div>
      <form id="form">
        <input id="texto" placeholder="Escribe como lo haría un cliente…" autocomplete="off" maxlength="500">
        <button id="enviar" aria-label="Enviar">➤</button>
      </form>
    </div>
  </section>

  <section class="agenda-col">
    <p class="rotulo">Lo que ve la peluquería</p>
    <iframe id="agenda" title="Agenda de la peluquería"></iframe>
  </section>
</main>

<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const texto = document.getElementById('texto');
  const enviar = document.getElementById('enviar');
  const chips = document.getElementById('chips');
  const agenda = document.getElementById('agenda');
  let sesion = null;
  let ocupado = false;

  // La agenda es el panel de /panel en modo demo; le pasamos la clave si la hay
  const params = new URLSearchParams(location.search);
  const clave = params.get('clave');
  const negocioSlug = params.get('n') || '';      // qué peluquería (vacío = la de ejemplo)
  agenda.src = '/panel?demo=1' + (clave ? '&clave=' + encodeURIComponent(clave) : '') +
               (negocioSlug ? '&n=' + encodeURIComponent(negocioSlug) : '');

  function refrescarAgenda() {
    try { agenda.contentWindow.cargarSemana(); } catch (e) { /* el panel aún no ha cargado */ }
  }

  function pinta(clase, contenido) {
    const d = document.createElement('div');
    d.className = 'msg ' + clase;
    d.textContent = contenido;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }

  function pintaEscribiendo() {
    const d = document.createElement('div');
    d.className = 'msg bot';
    d.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }

  function saludo() {
    pinta('bot', '¡Hola! 👋 Soy el asistente virtual de la peluquería. ¿En qué te puedo ayudar?');
  }

  async function manda(mensaje) {
    if (ocupado) return;
    ocupado = true;
    enviar.disabled = true;
    chips.style.display = 'none';
    pinta('user', mensaje);
    const espera = pintaEscribiendo();
    try {
      const r = await fetch('/api/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({mensaje, sesion, negocio: negocioSlug})
      });
      const datos = await r.json().catch(() => ({}));
      espera.remove();
      if (r.status === 429) {
        pinta('bot', 'Has llegado al límite de mensajes de esta demo. Vuelve a intentarlo más tarde.');
      } else if (datos.error) {
        pinta('bot', 'Vaya, algo ha fallado. Inténtalo de nuevo en un momento.');
        console.error(datos.error);
      } else {
        sesion = datos.sesion;
        pinta('bot', datos.respuesta);
        refrescarAgenda();     // si se ha reservado o cancelado algo, aparece al instante en la agenda
      }
    } catch (e) {
      espera.remove();
      pinta('bot', 'No he podido conectar con el servidor. ¿Está arrancado?');
    }
    ocupado = false;
    enviar.disabled = false;
    texto.focus({preventScroll: true});
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const m = texto.value.trim();
    if (!m) return;
    texto.value = '';
    manda(m);
  });

  chips.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => manda(c.textContent)));

  document.getElementById('reiniciar').addEventListener('click', () => {
    sesion = null;
    chat.replaceChildren();
    chips.style.display = '';
    saludo();
    refrescarAgenda();
    texto.focus({preventScroll: true});
  });

  fetch('/api/negocio' + (negocioSlug ? '?n=' + encodeURIComponent(negocioSlug) : '')).then(r => r.json()).then(n => {
    if (!n.nombre) return;
    document.getElementById('titulo').textContent = n.nombre;
    document.getElementById('negocio').textContent = '· ' + n.nombre;
    document.getElementById('inicial').textContent = n.nombre.trim().charAt(0).toUpperCase();
  }).catch(() => {});

  saludo();
  texto.focus({preventScroll: true});
</script>
</body>
</html>
